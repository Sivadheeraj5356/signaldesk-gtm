<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | SignalDesk</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#0b1224;color:#ecf0ff;font:16px system-ui;padding:24px}.card{width:100%;max-width:440px;border:1px solid #293552;border-radius:22px;padding:36px;background:#121d34}.brand{font-size:22px;font-weight:750;color:#a5b4fc;margin-bottom:40px}h1{font-size:32px;letter-spacing:-1px;margin-bottom:12px}p{color:#aab6ce;line-height:1.6}label{display:block;font-size:14px;margin:28px 0 8px}input{width:100%;padding:14px;border:1px solid #45516b;border-radius:10px;background:#0b1224;color:white;font:inherit}button{width:100%;margin-top:18px;border:0;border-radius:10px;background:#6366f1;color:white;padding:14px;font:600 16px system-ui;cursor:pointer}#error{color:#fda4af;font-size:14px;min-height:20px}small{color:#8e9bb4;line-height:1.6}</style></head><body><main class="card"><div class="brand">⌁ SignalDesk</div><h1>Your private GTM workspace.</h1><p>Research, qualify and prepare. Sign in to access your accounts and reviewed drafts.</p><form><label for="password">Workspace password</label><input id="password" type="password" autocomplete="current-password" required minlength="16"><button>Sign in</button><p id="error" role="alert"></p></form><small>Single-owner access. Nothing is sent or published from this workspace.</small></main><script>document.querySelector('form').onsubmit=async e=>{e.preventDefault();const b=document.querySelector('button');b.disabled=true;try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('input').value})});const j=await r.json();if(!r.ok)throw Error(j.error);location.reload()}catch(e){document.querySelector('#error').textContent=e.message}finally{b.disabled=false}}</script></body></html>
